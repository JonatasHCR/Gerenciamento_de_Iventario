services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # A porta do backend nao e publicada no host: quem fala com ele e o servidor
    # Next, por dentro da rede do Docker (API_URL abaixo).
    environment:
      ENGINE_ASYNC: postgresql+asyncpg
      ENGINE_SYNC: postgresql+psycopg2
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      OIDC_ISSUER: http://${HOST_IP:?defina HOST_IP no .env}:8080/realms/ufc
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-inventario-api}
      OIDC_REQUIRED_GROUP: ${OIDC_REQUIRED_GROUP:-/apps/inventario}
      # A conta mestra: UM email, o mesmo nos tres sistemas, que entra como
      # admin aqui sem depender de grupo nem de script de promocao.
      ADMIN_MESTRE_EMAIL: ${ADMIN_MESTRE_EMAIL:-}
      # Mesmo diretorio do sidecar de backup: os agendados e os feitos pelo
      # botao caem na mesma lista, e o scripts/restore.sh serve para os dois.
      BACKUP_DIR: /backups
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # O CMD roda `alembic upgrade head` antes do uvicorn, entao "saudavel" aqui
    # significa "schema migrado" — e o container de sync depende disso.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: http://backend:8000
      HOST_IP: ${HOST_IP}
      PORTA_PUBLICA: ${FRONTEND_PORT:-3000}
      # As portas dos outros sistemas, para o seletor "Sistemas" montar os links.
      # Vem do ambiente, e nao de NEXT_PUBLIC_*, que seria assado na imagem em
      # tempo de build e traria o IP de volta para os artefatos.
      PORTAL_PORT: ${PORTAL_PORT:-3080}
      INVENTARIO_PORT: ${INVENTARIO_PORT:-3030}
      RECEITA_PORT: ${RECEITA_PORT:-3040}
      DESPESA_PORT: ${DESPESA_PORT:-3010}
      CONTROLE_DESPESA_PORT: ${CONTROLE_DESPESA_PORT:-3050}
      OIDC_CLIENT_ID: inventario-web
      OIDC_CLIENT_SECRET: ${INVENTARIO_CLIENT_SECRET:?defina INVENTARIO_CLIENT_SECRET no .env}
      SESSION_SECRET: ${INVENTARIO_SESSION_SECRET:?defina INVENTARIO_SESSION_SECRET no .env}
      NODE_OPTIONS: "--max-http-header-size=65536"
    depends_on:
      - backend
    restart: unless-stopped

  # Puxa os centros de custo da receita a cada SYNC_INTERVAL_MINUTES.
  # Container proprio, e nao um scheduler dentro do FastAPI: um agendador
  # in-process multiplicaria com replicas, e duas instancias sincronizando o
  # mesmo dado ao mesmo tempo e problema garantido.
  #
  # Manual (primeira carga, ou para depurar):
  #   docker compose run --rm sync python sync_receita.py
  sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENGINE_ASYNC: postgresql+asyncpg
      ENGINE_SYNC: postgresql+psycopg2
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      OIDC_ISSUER: http://${HOST_IP}:8080/realms/ufc
      # A receita e alcancada pelo IP do host: os composes sao separados, entao
      # os containers nao compartilham rede.
      RECEITA_API_URL: ${RECEITA_API_URL:-http://${HOST_IP}:${RECEITA_PORT:-3040}}
      RECEITA_API_TOKEN: ${RECEITA_API_TOKEN:?defina RECEITA_API_TOKEN no .env (e o SYNC_API_TOKEN da receita)}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
    # `command`, e nao `entrypoint`: com entrypoint o
    # `docker compose run --rm sync python sync_receita.py` viraria ARGUMENTO do
    # laco infinito, e a execucao manual travaria.
    command:
      - /bin/sh
      - -c
      - |
        INTERVALO=$$(( $${SYNC_INTERVAL_MINUTES:-15} * 60 ))
        echo "[sync] a cada $${SYNC_INTERVAL_MINUTES:-15} min"
        while true; do
          python sync_receita.py || echo "[sync] falhou; tentando de novo no proximo ciclo"
          sleep "$$INTERVALO"
        done
    depends_on:
      postgres:
        condition: service_healthy
      # Espera o backend ficar saudavel, e nao so o Postgres: e o CMD dele que
      # roda `alembic upgrade head`. Sem isto o primeiro sync corre contra a
      # migracao e falha com "column tb_contratos.sincronizado_em does not
      # exist" — depois se recupera sozinho, mas so no ciclo seguinte.
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Restore (os backups sao .sql em texto puro):
  #   docker compose run --rm db-backup \
  #     sh -c 'psql -v ON_ERROR_STOP=1 -h postgres -U $DB_USER $DB_NAME -f /backups/<arquivo>.sql'
  db-backup:
    image: postgres:16-alpine
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    # `tr -d '\r'`: um editor no Windows pode gravar o script com CRLF, e o
    # /bin/sh falha com um erro obscuro. O mount e :ro, entao roda uma copia.
    command:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /scripts/backup.sh > /tmp/backup.sh
        INTERVAL=$$(( $${BACKUP_INTERVAL_HOURS:-24} * 3600 ))
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] Backup agendado a cada $${BACKUP_INTERVAL_HOURS:-24}h"
        while true; do
          sh /tmp/backup.sh
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Proximo backup em $${BACKUP_INTERVAL_HOURS:-24}h"
          sleep "$$INTERVAL"
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
